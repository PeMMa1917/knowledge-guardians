<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Knowledge Guardians · Choice review</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f1e8;
        --surface: #fffdf7;
        --ink: #202d36;
        --muted: #4b5c66;
        --line: #b7c1bb;
        --blue: #15535c;
        --sun: #eee2bd;
        font:
          100%/1.5 system-ui,
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
      }
      main {
        max-width: 94rem;
        margin: auto;
        padding: clamp(1rem, 3vw, 3rem);
      }
      h1 {
        font-family: Georgia, serif;
        font-size: clamp(1.9rem, 4vw, 3.5rem);
        margin: 0;
      }
      h2,
      h3 {
        line-height: 1.25;
        margin: 0.1rem 0 0.7rem;
      }
      p {
        margin: 0.3rem 0 0.9rem;
      }
      header {
        border-bottom: 2px solid var(--blue);
        padding-bottom: 0.8rem;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 0.75rem;
        margin: 1.1rem 0;
      }
      label {
        min-inline-size: 0;
        grid-template-columns: minmax(0, 1fr);
        display: grid;
        gap: 0.2rem;
        font-weight: 650;
        max-width: 100%;
      }
      select,
      input {
        inline-size: 100%;
        min-inline-size: 0;
      }
      select,
      input,
      button {
        font: inherit;
        min-height: 2.7rem;
        max-width: 100%;
        padding: 0.35rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 0.35rem;
        background: var(--surface);
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      :focus-visible {
        outline: 3px solid #bd641a;
        outline-offset: 2px;
      }
      .columns {
        display: grid;
        grid-template-columns: minmax(16rem, 0.8fr) minmax(0, 1.7fr);
        gap: 1rem;
      }
      .panel {
        padding: clamp(0.75rem, 2vw, 1.5rem);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 0.45rem;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .options {
        display: grid;
        gap: 0.35rem;
        max-height: 55vh;
        overflow: auto;
        padding: 0.3rem;
      }
      .options button {
        text-align: left;
        width: 100%;
        line-height: 1.3;
      }
      .options [aria-pressed='true'] {
        background: var(--sun);
        border-color: var(--blue);
      }
      #paging {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.7rem;
      }
      .profiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(17rem, 100%), 1fr));
        gap: 1rem;
      }
      .profile {
        min-inline-size: 0;
        border-top: 2px solid var(--blue);
        margin-top: 0.6rem;
        padding-top: 0.7rem;
      }
      .profile label {
        margin-bottom: 0.8rem;
        overflow: hidden;
        padding: 0.3rem;
      }
      .profile label:focus-within {
        outline: 2px solid var(--blue);
        outline-offset: -2px;
      }
      .profile select {
        text-overflow: ellipsis;
      }
      dt {
        font-weight: 700;
        margin-top: 0.5rem;
      }
      dd {
        margin: 0 0 0.5rem;
      }
      blockquote {
        padding: 0.3rem 0.9rem;
        margin: 0.7rem 0;
        border-left: 3px solid var(--blue);
      }
      .muted {
        color: var(--muted);
      }
      summary {
        cursor: pointer;
        font-weight: 650;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          90%/1.4 ui-monospace,
          monospace;
      }
      a {
        color: var(--blue);
      }
      @media (max-width: 700px) {
        .columns {
          grid-template-columns: 1fr;
        }
        .options {
          max-height: 16rem;
        }
        form > * {
          flex: 1 1 9rem;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15232b;
          --surface: #1e303b;
          --ink: #edf1ea;
          --muted: #bdcec8;
          --line: #697d80;
          --blue: #91dfd3;
          --sun: #304b49;
        }
      }
      @media print {
        main {
          padding: 0;
        }
        .columns,
        .profiles {
          display: block;
        }
        .panel {
          border: 0;
          padding: 0;
        }
        form,
        aside,
        #controls {
          display: none;
        }
        details {
          display: none;
        }
        header {
          margin-bottom: 1rem;
        }
        .profile label {
          display: none;
        }
        .profile {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Knowledge Guardians</h1>
        <h2>Choice review</h2>
        <p id="inventory" class="muted">Opening the review…</p>
      </header>
      <form id="filter">
        <label
          >Chapter<select id="chapter">
            <option value="">All chapters</option>
          </select></label
        ><label
          >Room<select id="room">
            <option value="">All rooms</option>
          </select></label
        ><label
          >Inspect<select id="kind">
            <option value="">Choices and stations</option>
            <option value="choice">Dialogue choices</option>
            <option value="station">Map stations</option>
          </select></label
        ><label>Find a choice, person or place<input id="search" type="search" /></label>
      </form>
      <div class="columns">
        <aside class="panel" aria-label="Search results">
          <p id="count" role="status"></p>
          <div class="options" id="options"></div>
          <div id="paging">
            <button id="prev" type="button">Previous page</button
            ><button id="next" type="button">Next page</button>
          </div>
        </aside>
        <article class="panel" id="article" aria-label="Selected encounter">
          <div id="scene"></div>
          <div class="profiles">
            <section class="profile">
              <label>First perspective<select id="first"></select></label>
              <div id="left"></div>
            </section>
            <section class="profile">
              <label>Second perspective<select id="second"></select></label>
              <div id="right"></div>
            </section>
          </div>
        </article>
      </div>
    </main>
    <!-- PACK --><!-- READER -->
  </body>
</html>
